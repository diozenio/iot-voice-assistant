[package]
name = "iot-voice-assistant"
version = "0.1.0"
description = "Assistente de voz IoT com servidor WebSocket nativo"
authors = ["Dionisio Barbosa"]
edition = "2024"

[lib]
name = "iot_voice_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
async-trait = "0.1.92"
chrono = "0.4.45"
local-ip-address = "0.6.13"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2", "multipart"] }
nnnoiseless = "0.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
